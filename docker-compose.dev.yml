services:
  app:
    image: oven/bun:latest
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    ports:
      - "9876:9876"
    environment:
      PORT: 9876
    command: sh -c "bun install --frozen-lockfile && bun run dev --http"
    restart: unless-stopped

volumes:
  app_node_modules:
