name: Deploy to Railway

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: railway-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          set -o pipefail
          for i in 1 2 3 4 5; do
            if curl -fsSL https://railway.com/install.sh | sh; then
              exit 0
            fi
            echo "Install attempt $i failed, retrying in 15s..."
            sleep 15
          done
          echo "Railway CLI install failed after 5 attempts"
          exit 1

      - name: Add Railway CLI to PATH
        run: echo "$HOME/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy
        run: railway up --service "$RAILWAY_SERVICE" --ci
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ secrets.RAILWAY_SERVICE }}
